<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="14" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Compass needle - North (red/coral) -->
  <polygon points="16,4 13,16 16,14 19,16" fill="#f87171"/>
  <!-- Compass needle - South (white) -->
  <polygon points="16,28 13,16 16,18 19,16" fill="white" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
  <!-- Cardinal direction marks -->
  <line x1="16" y1="2" x2="16" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="16" y2="30" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="2" y1="16" x2="5" y2="16" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="27" y1="16" x2="30" y2="16" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
